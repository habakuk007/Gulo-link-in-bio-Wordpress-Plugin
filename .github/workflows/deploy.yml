name: Deploy to WordPress.org

# Triggers on any version tag push, e.g. "1.0.0" or "1.0.0-rc1".
# Tag format: push `git tag 1.0.0 && git push origin 1.0.0`
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    environment: Deploy
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build JS/CSS (if you add a build step in the future, put it here) ──

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          # WordPress.org credentials — add these as repository secrets:
          #   Settings → Secrets and variables → Actions → New repository secret
          #   SVN_USERNAME = your WordPress.org username
          #   SVN_PASSWORD = your WordPress.org password or application password
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

          # WordPress.org plugin slug — must match the slug approved by the review team.
          SLUG: gulo-link-in-bio

          # Directory containing plugin artwork (banner, icon, screenshots).
          # These are copied to the SVN /assets/ folder, NOT included in the plugin ZIP.
          ASSETS_DIR: .wordpress-org
